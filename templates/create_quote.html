<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DrawQuote v{{VERSION}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <!-- html2pdf: SRI 제거(무결성 불일치로 차단되던 문제 방지) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <div class="badge">DrawQuote v{{VERSION}}</div>

  <div id="sidebar">
    <button id="exportPDF" class="edit-item mt-8">📄 PDF 저장</button>
    <button id="previewPDF" class="edit-item">👁 미리보기</button>
    <div class="panel-title">문서 편집</div>
    <button id="addText" class="edit-item">🅰 텍스트</button>
    <button id="addField" class="edit-item">🏷 필드</button>
  </div>

  <div id="canvas-wrapper"><div id="canvas"></div></div>

  <div id="properties">
    <label>스타일
      <select id="fontFamily" disabled>
        <option value="">선택 안 됨</option>
        <option value="sans-serif">본고딕</option>
        <option value="serif">명조</option>
        <option value="monospace">고정폭</option>
      </select>
    </label>
    <label>크기
      <select id="fontSize" disabled>
        <option value="">선택 안 됨</option>
        <option value="12pt">12pt</option>
        <option value="14pt">14pt</option>
        <option value="16pt">16pt</option>
      </select>
    </label>

    <!-- 필드 박스 전용 속성 -->
    <div id="fieldProps" style="display:none; margin-top:10px;">
      <label>오브젝트
        <select id="sfObject">
          <option value="Account">Account</option>
          <option value="Opportunity">Opportunity</option>
          <option value="Order">Order</option>
        </select>
      </label>
      <label>필드
        <select id="sfField"></select>
      </label>
    </div>

    <div class="align-wrap">정렬:
      <button class="align-btn" data-align="left">좌</button>
      <button class="align-btn" data-align="center">중앙</button>
      <button class="align-btn" data-align="right">우</button>
    </div>

    <div id="deleteBox" class="delete-btn">🗑 삭제</div>
  </div>

  <!-- PDF 미리보기 모달 -->
  <div id="previewModal" class="modal" aria-hidden="true">
    <div class="modal__dialog">
      <div class="modal__header">
        <strong>PDF 미리보기</strong>
        <button id="closePreview" class="modal__close" aria-label="닫기">✕</button>
      </div>
      <iframe id="previewFrame" class="modal__frame" title="PDF Preview"></iframe>
    </div>
  </div>
</body>
</html>
