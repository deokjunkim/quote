<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DrawQuote v{{VERSION}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <!-- 외부 라이브러리: SRI 권장 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
          integrity="sha512-YcsIP6w1QnN0r0m7X8lY2QGg3Wc6f0x8QO6X3jYq6p9f3q3v1vN1k7mQw0h9wF0n8o1a7wq6gZFZ8C2aF3+J1w=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <div class="badge">DrawQuote v{{VERSION}}</div>

  <div id="sidebar">
    <button id="exportPDF" class="edit-item" style="margin-top:8px;">📄 PDF 저장</button>
    <div style="font-weight:bold; margin:10px 0 6px;">문서 편집</div>
    <button id="addText" class="edit-item">🅰 텍스트</button>
    <button id="addObject" class="edit-item">🔳 오브젝트</button>
  </div>

  <div id="canvas-wrapper"><div id="canvas"></div></div>

  <div id="properties">
    <label>스타일
      <select id="fontFamily" disabled>
        <option value="">선택 안 됨</option>
        <option value="sans-serif">본고딕</option>
        <option value="serif">명조</option>
        <option value="monospace">고정폭</option>
      </select>
    </label>
    <label>크기
      <select id="fontSize" disabled>
        <option value="">선택 안 됨</option>
        <option value="12pt">12pt</option>
        <option value="14pt">14pt</option>
        <option value="16pt">16pt</option>
      </select>
    </label>
    <label>입력 형식
      <select id="inputType" disabled>
        <option value="">선택 안 됨</option>
        <option value="text">텍스트</option>
        <option value="number">숫자</option>
        <option value="date">날짜</option>
      </select>
    </label>
    <div style="margin-top:10px;">정렬:
      <button class="align-btn" data-align="left">좌</button>
      <button class="align-btn" data-align="center">중앙</button>
      <button class="align-btn" data-align="right">우</button>
    </div>
    <div id="deleteBox" class="delete-btn">🗑 삭제</div>
  </div>
</body>
</html>
